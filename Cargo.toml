[package]
name = "mockingbird"
version = "0.1.0"
edition = "2024"

[dependencies]
amane = { git = "https://github.com/MystiaFin/amane", rev = "3080024" }
chrono = "0.4.45"
freedesktop-desktop-entry = { version = "0.8.3", default-features = false }
freedesktop-icons = "0.4.0"
hipc = { git = "https://github.com/VirgileHenry/hipc", rev = "0ef5700" }
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
